<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
:root{
  --ink:#16191d; --ink2:#5a6067; --ink3:#8a9097; --ground:#f7f7f5; --card:#ffffff; --muted:#eef0ee; --line:#dcdcd8;
  --accent:#2f5fb8; --accent-bg:#e8eefa; --ok:#2f7a4f; --ok-bg:#e3f1e8; --fix:#9a5b00; --fix-bg:#f7ecd6; --skip:#5a6067; --skip-bg:#ececeb;
  --pin:#c26a00; --pin-ink:#ffffff; --shadow:0 1px 2px rgba(20,20,20,.06),0 8px 24px rgba(20,20,20,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#e7e9e4; --ink2:#a1a7ad; --ink3:#737a81; --ground:#111316; --card:#1a1d21; --muted:#1e2125; --line:#2a2e34;
  --accent:#8ba9ea; --accent-bg:#1c2740; --ok:#7fc99a; --ok-bg:#173023; --fix:#e0ab52; --fix-bg:#332711; --skip:#a1a7ad; --skip-bg:#26292d; --shadow:none; }}
:root[data-theme="dark"]{
  --ink:#e7e9e4; --ink2:#a1a7ad; --ink3:#737a81; --ground:#111316; --card:#1a1d21; --muted:#1e2125; --line:#2a2e34;
  --accent:#8ba9ea; --accent-bg:#1c2740; --ok:#7fc99a; --ok-bg:#173023; --fix:#e0ab52; --fix-bg:#332711; --skip:#a1a7ad; --skip-bg:#26292d; --shadow:none; }

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;padding-block:0 96px;padding-inline:20px}
.rb-wrap{max-width:1080px;margin:0 auto}
h1,h2,h3,h4{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-wrap:balance;margin:0}
h1{font-size:38px;line-height:1.08;letter-spacing:-.02em;font-weight:600}
h2{font-size:26px;line-height:1.15;letter-spacing:-.02em;font-weight:600;margin:64px 0 12px;padding-top:22px;border-top:1px solid var(--line)}
p{max-width:70ch;margin:0 0 12px}
.rb-hero{padding-block:48px 24px;display:grid;gap:12px}
.rb-lead{font-size:18px;color:var(--ink2);max-width:62ch}
.rb-eyebrow{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.rb-cap{font-size:14px;color:var(--ink2)}
.rb-help{border-left:3px solid var(--accent);background:var(--accent-bg);padding:10px 14px;border-radius:0 10px 10px 0;font-size:15px;max-width:76ch}

/* toolbar */
.rb-bar{position:sticky;top:0;z-index:20;background:var(--ground);margin-inline:-20px;padding:10px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rb-bar a{text-decoration:none;color:var(--ink2);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;font-size:13px}
.rb-bar a:hover{color:var(--accent)}
.rb-btn{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--muted);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.rb-btn.primary{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.rb-count{display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--ground);font-size:11px;margin-left:4px}
.rb-tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.rb-status{font-size:12px;color:var(--ink2)}

/* decisions */
.rb-decs{display:grid;gap:12px}
.rb-dec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:8px}
.rb-dec .q{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;font-size:17px}
.rb-opts{display:flex;flex-wrap:wrap;gap:8px}
.rb-opt{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--muted);color:var(--ink);cursor:pointer}
.rb-opt.rec{border-color:var(--accent)}
.rb-opt.rec::after{content:" · recommended";color:var(--ink2);font-size:12px}
.rb-opt.sel{background:var(--accent);border-color:var(--accent);color:var(--ground)}
.rb-opt.sel.rec::after{color:var(--ground)}
.rb-why{font-size:14px;color:var(--ink2)}

/* screens */
.rb-screen{margin:36px 0 8px;scroll-margin-top:70px}
.rb-screen h3{font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rb-no{display:inline-block;min-width:30px;height:30px;line-height:30px;text-align:center;border-radius:8px;background:var(--ink);color:var(--ground);font-size:14px;font-weight:600}
.rb-meta{font-size:13px;color:var(--ink3);font-weight:400}
.rb-screen.reviewed h3{border-left:3px solid var(--ok);padding-left:10px}
.rb-body{display:grid;gap:18px;margin-top:12px}
.rb-body.single{grid-template-columns:minmax(0,400px) minmax(0,1fr);align-items:start}
.rb-body.single.wide{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:820px){.rb-body.single,.rb-body.single.wide{grid-template-columns:1fr}}
.rb-imgs{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:start}
.rb-shot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.rb-shot .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;font-size:14px}
.rb-pinwrap{position:relative;margin:0 auto}
.rb-pinwrap img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.rb-box{position:absolute;border:1.5px solid color-mix(in srgb,var(--pin) 60%,transparent);border-radius:3px;pointer-events:none}
.rb-pin{position:absolute;transform:translate(-100%,-50%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:10px;font-weight:700;line-height:1;padding:2px 5px;border-radius:999px;background:var(--pin);color:var(--pin-ink);text-decoration:none;box-shadow:0 0 0 1.5px #fff;z-index:2;white-space:nowrap;scroll-margin-top:140px}
.rb-pin:hover,.rb-pin.hl,.rb-pin:target{background:var(--ink);z-index:3}
.rb-box.hl{border-color:var(--ink);background:color-mix(in srgb,var(--pin) 18%,transparent)}
.rb-lead-s{font-size:15px;color:var(--ink2);max-width:72ch;margin-top:6px}

/* items */
.rb-items{list-style:none;margin:0;padding:0;display:grid}
.rb-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line);scroll-margin-top:90px;font-size:14px}
.rb-item:target,.rb-item.hl{background:var(--fix-bg);border-radius:6px}
.rb-num{display:inline-block;min-width:36px;text-align:center;border-radius:6px;background:var(--ink);color:var(--ground);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:11px;font-weight:600;padding:2px 4px;text-decoration:none;margin-top:2px}
.rb-vs{display:flex;gap:4px;white-space:nowrap}
.rb-v{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;font-size:12px;border:1px solid var(--line);background:var(--muted);color:var(--ink);border-radius:999px;padding:3px 9px;cursor:pointer}
.rb-v.sel[data-tone="ok"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.rb-v.sel[data-tone="fix"]{background:var(--fix-bg);border-color:var(--fix);color:var(--fix)}
.rb-v.sel[data-tone="skip"]{background:var(--skip-bg);border-color:var(--skip);color:var(--skip)}
.rb-cmt{grid-column:2/4;display:flex;gap:8px;align-items:center}
.rb-cmt input,.rb-dec textarea,.rb-sbar input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--ground);color:var(--ink);flex:1;min-width:0}
.rb-dec textarea{width:100%;min-height:36px;resize:vertical}
.rb-st{font-size:12px;color:var(--ink2);white-space:nowrap}
.rb-applied{display:inline-block;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--ok);color:var(--ground);margin-left:6px}
.rb-foot{font-size:13px;color:var(--ink2);padding-top:6px}
.rb-sbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding:10px 12px;background:var(--card);border:1px dashed var(--line);border-radius:10px;font-size:14px}
@media (max-width:640px){.rb-item{grid-template-columns:auto minmax(0,1fr)}.rb-vs{grid-column:2/3}.rb-cmt{grid-column:1/3}}

/* json panel */
.rb-panel{position:fixed;top:0;right:0;height:100vh;width:min(500px,100vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.12);z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s}
.rb-panel.open{transform:none}
.rb-panel .h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;flex-wrap:wrap}
.rb-panel pre{flex:1;margin:0;padding:14px 16px;overflow:auto;font-size:12px;line-height:1.45;white-space:pre;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.rb-panel{transition:none}}
</style>

<div class="rb-wrap">
{{HEADER}}
<nav class="rb-bar">
  {{NAV}}
  <span class="rb-tools">
    <span class="rb-status" id="rb-status"></span>
    <button class="rb-btn primary" id="rb-json" type="button">JSON <span class="rb-count" id="rb-count">0</span></button>
  </span>
</nav>
{{DECISIONS}}
{{SECTIONS}}
</div>

<aside class="rb-panel" id="rb-panel" aria-label="Verdicts in JSON">
  <div class="h"><span>My verdicts</span><span class="rb-status" id="rb-pstat"></span>
    <span style="margin-left:auto;display:flex;gap:6px">
      <button class="rb-btn primary" id="rb-dl" type="button">Download JSON</button>
      <button class="rb-btn" id="rb-copy" type="button">Copy</button>
      <button class="rb-btn" id="rb-close" type="button">Close</button>
    </span>
  </div>
  <pre id="rb-pre">{}</pre>
</aside>

<script id="rb-config" type="application/json">{{CONFIG}}</script>
<script>
(function(){
  const CFG = JSON.parse(document.getElementById('rb-config').textContent);
  const LABEL = Object.fromEntries(CFG.verdicts.map(v => [v.v, v.label]));
  const COL = CFG.collection;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const iso = () => new Date().toISOString();
  const fmt = d => { if (!d) return ''; try { return new Date(d).toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}); } catch (e) { return ''; } };
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const use = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);

  let state = {}, mode = 'none', db = null, downloads = null;
  const pending = {};
  const LS = 'review-board:' + CFG.storageKey;
  function setStatus(t) { $('#rb-status').textContent = t || ''; }
  function lsLoad() { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { return {}; } }
  function lsSave() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }

  async function persist(key) {
    if (mode === 'local') { lsSave(); return; }
    if (mode !== 'db') return;
    if (pending[key]) { pending[key].again = true; return; }
    pending[key] = {again: false};
    try {
      do { pending[key].again = false; await db.doc(COL + '/' + key).set(state[key]); } while (pending[key].again);
    } catch (e) { setStatus('Could not save: ' + (e && e.code || 'error')); }
    finally { delete pending[key]; }
  }
  function save(key, patch) {
    state[key] = Object.assign({}, state[key] || {}, patch, {at: iso()});
    render(); persist(key);
  }

  // ---- decisions
  $$('.rb-dec').forEach(card => {
    const key = card.dataset.key;
    $$('.rb-opt', card).forEach(b => b.addEventListener('click', () => {
      const cur = (state[key] || {}).value;
      save(key, {kind: 'decision', question: card.dataset.q, value: cur === b.dataset.value ? '' : b.dataset.value});
    }));
    const ta = $('textarea', card);
    ta.addEventListener('input', debounce(() => save(key, {kind: 'decision', question: card.dataset.q, comment: ta.value}), 700));
  });

  // ---- items
  $$('.rb-item').forEach(li => {
    const key = li.dataset.key;
    const meta = () => ({kind: 'item', screen: li.dataset.screen, item: li.dataset.no, text: li.dataset.t});
    $$('.rb-v', li).forEach(b => b.addEventListener('click', () => {
      const cur = (state[key] || {}).value;
      save(key, Object.assign(meta(), {value: cur === b.dataset.v ? '' : b.dataset.v}));
      if (b.dataset.v === CFG.focusCommentOn) $('input', li).focus();
    }));
    const inp = $('.rb-cmt input', li);
    inp.addEventListener('input', debounce(() => save(key, Object.assign(meta(), {comment: inp.value})), 700));
  });

  // ---- screens
  $$('.rb-screen').forEach(sc => {
    const key = sc.dataset.key, bar = $('.rb-sbar', sc);
    const meta = () => ({kind: 'screen', screen: sc.dataset.id, no: sc.dataset.no, title: sc.dataset.t});
    $$('.rb-v', bar).forEach(b => b.addEventListener('click', () => {
      const cur = (state[key] || {}).value;
      save(key, Object.assign(meta(), {value: cur === b.dataset.v ? '' : b.dataset.v}));
    }));
    const all = $('[data-all]', bar);
    if (all) all.addEventListener('click', () => {
      $$('.rb-item', sc).forEach(li => { state[li.dataset.key] = Object.assign({}, state[li.dataset.key] || {}, {kind: 'item', screen: li.dataset.screen, item: li.dataset.no, text: li.dataset.t, value: all.dataset.all, at: iso()}); persist(li.dataset.key); });
      save(key, Object.assign(meta(), {value: all.dataset.all}));
    });
    const inp = $('input', bar);
    inp.addEventListener('input', debounce(() => save(key, Object.assign(meta(), {comment: inp.value})), 700));
  });

  // ---- hover link between pins and items
  document.addEventListener('mouseover', e => {
    const t = e.target.closest('[data-it]'); if (!t) return;
    const id = t.dataset.it, on = v => $$('[data-it="' + id + '"]').forEach(x => x.classList.toggle('hl', v));
    on(true); t.addEventListener('mouseleave', () => on(false), {once: true});
  });

  function applied(v, long) {
    if (!v || !v.applied) return '';
    return '<span class="rb-applied">' + (long ? (CFG.appliedLabel + ' · ') : 'applied · ') + fmt(v.appliedAt) + '</span>' + (v.appliedNote ? ' ' + escapeHtml(v.appliedNote) : '');
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function syncInput(el, val) { if (el && document.activeElement !== el && (val || '') !== el.value) el.value = val || ''; }

  function render() {
    $$('.rb-dec').forEach(card => {
      const v = state[card.dataset.key] || {};
      $$('.rb-opt', card).forEach(b => b.classList.toggle('sel', !!v.value && b.dataset.value === v.value));
      syncInput($('textarea', card), v.comment);
      $('.rb-st', card).innerHTML = (v.value ? 'Selected · ' + fmt(v.at) : '') + applied(v);
    });
    $$('.rb-item').forEach(li => {
      const v = state[li.dataset.key] || {};
      $$('.rb-v', li).forEach(b => b.classList.toggle('sel', v.value === b.dataset.v));
      syncInput($('.rb-cmt input', li), v.comment);
      $('.rb-st', li).innerHTML = (v.value ? LABEL[v.value] + ' · ' + fmt(v.at) : '') + applied(v);
    });
    $$('.rb-screen').forEach(sc => {
      const v = state[sc.dataset.key] || {}, bar = $('.rb-sbar', sc);
      $$('.rb-v', bar).forEach(b => b.classList.toggle('sel', v.value === b.dataset.v));
      syncInput($('input', bar), v.comment);
      const items = $$('.rb-item', sc), done = items.filter(li => (state[li.dataset.key] || {}).value).length;
      $('.rb-st', bar).innerHTML = (items.length ? done + ' of ' + items.length + ' items scored' : '') + (v.value ? ' · screen: ' + LABEL[v.value] : '') + applied(v, true);
      sc.classList.toggle('reviewed', !!v.applied);
    });
    const j = exportJson();
    $('#rb-pre').textContent = JSON.stringify(j, null, 2);
    const n = Object.values(state).filter(v => v && v.value).length;
    $('#rb-count').textContent = n;
    $('#rb-pstat').textContent = n + ' verdicts';
  }

  function exportJson() {
    const out = {title: CFG.title, exportedAt: iso(), decisions: {}, screens: {}};
    $$('.rb-dec').forEach(card => { const v = state[card.dataset.key]; if (v && (v.value || v.comment || v.applied)) out.decisions[card.dataset.key] = Object.assign({question: card.dataset.q}, v); });
    $$('.rb-screen').forEach(sc => {
      const v = state[sc.dataset.key] || {}, items = {};
      $$('.rb-item', sc).forEach(li => { const iv = state[li.dataset.key]; if (iv && (iv.value || iv.comment || iv.applied)) items[li.dataset.no] = {text: li.dataset.t, verdict: iv.value || '', comment: iv.comment || '', at: iv.at || '', applied: !!iv.applied, appliedAt: iv.appliedAt || '', appliedNote: iv.appliedNote || ''}; });
      if (v.value || v.comment || v.applied || Object.keys(items).length) out.screens[sc.dataset.no] = {id: sc.dataset.id, title: sc.dataset.t, verdict: v.value || '', comment: v.comment || '', applied: !!v.applied, appliedAt: v.appliedAt || '', items};
    });
    return out;
  }

  // ---- panel, copy, download
  const panel = $('#rb-panel');
  $('#rb-json').addEventListener('click', () => { panel.classList.toggle('open'); render(); });
  $('#rb-close').addEventListener('click', () => panel.classList.remove('open'));
  async function copy(text) { try { await navigator.clipboard.writeText(text); return true; } catch (e) { return false; } }
  $('#rb-copy').addEventListener('click', async () => { const ok = await copy($('#rb-pre').textContent); $('#rb-copy').textContent = ok ? 'Copied' : 'Failed'; setTimeout(() => $('#rb-copy').textContent = 'Copy', 1500); });
  $('#rb-dl').addEventListener('click', async () => {
    const data = JSON.stringify(exportJson(), null, 2);
    if (downloads) {
      try { await downloads.save({filename: CFG.exportFilename, data}); }
      catch (e) { if (e && e.code !== 'declined') { const ok = await copy(data); setStatus('Could not download' + (ok ? ', JSON copied' : '')); } }
    } else { const ok = await copy(data); setStatus(ok ? 'Download is not available here, JSON copied' : 'Download is not available here'); }
  });

  render();
  (async () => {
    downloads = await use('downloads');
    db = await use('db');
    if (db) {
      mode = 'db';
      db.collection(COL).onSnapshot(snap => {
        const s = {};
        snap.docs.forEach(d => { if (d.exists) s[d.id] = Object.assign({}, d.data()); });
        Object.keys(pending).forEach(k => { if (state[k]) s[k] = state[k]; });
        state = s; render();
      }, e => setStatus('Saving is not available: ' + (e && e.code || 'error')));
    } else {
      mode = 'local'; state = lsLoad(); render();
      setStatus('Verdicts are saved only in this browser');
    }
  })();
})();
</script>
