<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, maximum-scale=1">
<title>Checkout</title>
<style>
body{font-family:system-ui;margin:0;background:#f4f4f4;color:#333}
.wrap{max-width:420px;margin:24px auto;padding:16px;background:#fff}
h1{font-size:22px} h2{font-size:22px;color:#e00}
.promo{background:#e00;color:#fff;padding:14px;font-weight:700;font-size:18px}
input{display:block;width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;outline:none;transition:all .3s ease-in}
.row{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:14px;border:0;background:#0a7;color:#fff;font-weight:700;border-radius:6px}
.total{color:#aaa;font-size:12px}
</style></head><body><div class="wrap">
<div class="promo">🔥 SALE! 30% OFF EVERYTHING — ONLY TODAY!</div>
<h1>Checkout</h1><h2>Payment</h2>
<input placeholder="Card number"><input placeholder="MM/YY"><input placeholder="CVC">
<div class="total">Total: $120.00 (+ $9.99 service fee added at next step)</div>
<div class="row"><div class="btn" onclick="pay()">Pay now</div><button class="btn">Save card &amp; pay</button></div>
<p style="font-size:10px;color:#ccc">By paying you agree to auto-renewal. Lorem ipsum terms.</p>
</div></body></html>
